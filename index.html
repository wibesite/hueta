<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,user-scalable=yes"><meta name="theme-color" content="#151719"><title>Карта серверов и клиентов</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#151719;color:#eee;font-family:system-ui,-apple-system,Arial,sans-serif}header{position:absolute;z-index:4;top:0;left:0;right:0;background:#202326f2;border-bottom:1px solid #353b42;padding:10px 13px;display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap}h1{font-size:15px;margin:0 0 3px;font-weight:700}small{font-size:11px;color:#9eacb9}.tools{display:flex;align-items:center;gap:6px;flex-wrap:wrap}button{font:inherit;font-size:13px;color:#dceafa;background:#303943;border:1px solid #4a5b6d;border-radius:9px;min-width:37px;min-height:37px;padding:7px 10px;cursor:pointer}button:active{background:#46617b}#search{min-height:37px;width:128px;max-width:32vw;background:#15191d;color:white;border:1px solid #536477;border-radius:9px;padding:0 9px;font-size:13px}#map{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab}#map.drag{cursor:grabbing}#hint{position:absolute;bottom:12px;left:12px;z-index:2;border:1px solid #3c454f;border-radius:10px;background:#20252ce8;color:#afc2d2;font-size:11px;padding:8px 11px;pointer-events:none;max-width:calc(100% - 24px)}#count{color:#80baff;font-size:11px}#toast{position:absolute;z-index:5;bottom:75px;left:50%;transform:translateX(-50%);background:#314253;padding:10px 14px;border-radius:9px;display:none;font-size:12px;white-space:nowrap}@media(max-width:650px){header{padding:8px;gap:6px}.heading{width:100%}.tools{width:100%;justify-content:space-between}#search{flex:1;max-width:none;width:80px}#hint{bottom:8px;font-size:10px}}
</style></head><body><header><div class="heading"><h1>схема серверов и клиентов</h1><small>основной + резервный → общая линия → 1 010 100 клиентов · <span id="count"></span></small></div><div class="tools"><input id="search" type="text" inputmode="text" placeholder="найти: 1.25.76" aria-label="Найти клиента"><button id="find">найти</button><button id="minus" aria-label="Уменьшить">−</button><button id="plus" aria-label="Увеличить">+</button><button id="fit">обзор</button><button id="reset">свернуть</button></div></header><canvas id="map"></canvas><div id="hint">👆 нажми на узел: раскрыть 100 клиентов · перетаскивай карту · двумя пальцами меняй масштаб</div><div id="toast"></div><script>
(()=>{'use strict';const canvas=document.getElementById('map'),ctx=canvas.getContext('2d'),count=document.getElementById('count'),header=document.querySelector('header');const expanded=new Set();let rows=[],lookup=new Map(),scale=.9,panX=0,panY=0,w=0,h=0,dpr=1,dirty=true;const ROW=36,TOP=110,XS=[450,820,1210],MAX_VISIBLE=25000;let pointers=new Map(),dragDistance=0,lastPinch=0;const textColor='#d4d8de';function build(){rows=[];lookup=new Map();function add(id,depth,parent){if(rows.length>=MAX_VISIBLE)return;const n={id,depth,parent,x:XS[depth-1],y:TOP+rows.length*ROW};rows.push(n);lookup.set(id,n);if(depth<3&&expanded.has(id))for(let j=1;j<=100;j++)add(id+'.'+j,depth+1,id)}for(let i=1;i<=100;i++)add(String(i),1,null);count.textContent='отображено '+rows.length.toLocaleString('ru-RU');dirty=true}
function resize(){w=innerWidth;h=innerHeight;dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);canvas.style.width=w+'px';canvas.style.height=h+'px';dirty=true}function world(sx,sy){return{x:(sx-panX)/scale,y:(sy-panY)/scale}}function roundRect(x,y,ww,hh,r){ctx.beginPath();ctx.roundRect(x,y,ww,hh,r)}function line(x1,y1,x2,y2,col){ctx.beginPath();ctx.moveTo(x1,y1);const dx=x2-x1;ctx.bezierCurveTo(x1+Math.max(45,dx*.35),y1,x2-Math.max(45,dx*.35),y2,x2,y2);ctx.strokeStyle=col;ctx.lineWidth=1.25;ctx.stroke()}function drawNode(x,y,label,sub,active=false,server=false){ctx.fillStyle=active?'#3b77b0':'#222d37';ctx.strokeStyle='#4b9ff2';ctx.lineWidth=2;ctx.beginPath();ctx.arc(x,y,server?10:8,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.fillStyle=server?'#f4f7fa':textColor;ctx.font=(server?'bold 17px':'14px')+' system-ui,Arial';ctx.textBaseline='middle';ctx.fillText(label,x+17,y);if(sub){const tx=x+19+ctx.measureText(label).width;ctx.font='12px system-ui,Arial';ctx.fillStyle='#8195a6';ctx.fillText(sub,tx,y)}if(active){ctx.fillStyle='#cbe6ff';ctx.font='bold 13px system-ui';ctx.fillText('−',x-4,y+1)}else if(!server&&label.split('.').length<4){ctx.fillStyle='#b2d9ff';ctx.font='bold 12px system-ui';ctx.fillText('+',x-3.6,y+.5)}}function render(){if(!dirty)return;dirty=false;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);ctx.fillStyle='#151719';ctx.fillRect(0,0,w,h);ctx.save();ctx.translate(panX,panY);ctx.scale(scale,scale);const minY=(-panY/scale)-60,maxY=(h-panY)/scale+60,minX=(-panX/scale)-380,maxX=(w-panX)/scale+80;const sy=TOP+15,by=TOP+125,braceX=335,braceY=(sy+by)/2;const firstX=XS[0];if(minX<firstX&&maxX>70){drawNode(65,sy,'основной сервер','(данные и фото)',false,true);drawNode(65,by,'резервный сервер','(бекапы)',false,true);const joinX=braceX,fromX=75;ctx.save();ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#324c67';ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(fromX,sy);ctx.bezierCurveTo(235,sy,252,braceY,joinX,braceY);ctx.moveTo(fromX,by);ctx.bezierCurveTo(235,by,252,braceY,joinX,braceY);ctx.stroke();ctx.strokeStyle='#62a9f0';ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(fromX,sy);ctx.bezierCurveTo(235,sy,252,braceY,joinX,braceY);ctx.moveTo(fromX,by);ctx.bezierCurveTo(235,by,252,braceY,joinX,braceY);ctx.stroke();ctx.beginPath();ctx.arc(joinX,braceY,7,0,Math.PI*2);ctx.fillStyle='#151719';ctx.fill();ctx.strokeStyle='#74b9ff';ctx.lineWidth=3;ctx.stroke();ctx.restore();}ctx.save();ctx.beginPath();ctx.rect(minX-20,minY-20,maxX-minX+40,maxY-minY+40);ctx.clip();for(const n of rows){if(n.y<minY||n.y>maxY)continue;if(n.x<minX-300||n.x>maxX+20)continue;if(n.depth===1)line(braceX,braceY,n.x-11,n.y,'#48515c');else{const p=lookup.get(n.parent);if(p)line(p.x+140,p.y,n.x-11,n.y,'#46515e')}}for(const n of rows){if(n.y<minY||n.y>maxY||n.x<minX-300||n.x>maxX+20)continue;drawNode(n.x,n.y,'клиент '+n.id,n.depth<3?' (100)':null,expanded.has(n.id))}ctx.restore();ctx.restore()}
function tick(){render();requestAnimationFrame(tick)}function zoomAt(factor,cx,cy){const old=world(cx,cy);scale=Math.max(.18,Math.min(2.8,scale*factor));panX=cx-old.x*scale;panY=cy-old.y*scale;dirty=true}function overview(){const head=header.getBoundingClientRect().height;scale=Math.max(.32,Math.min(.95,(w-35)/850));panX=18;panY=head+28-TOP*scale;dirty=true}function focus(id){const bits=id.split('.');if(bits.length>3||bits.some(v=>!/^\d+$/.test(v)||+v<1||+v>100)){toast('формат: 1, 1.25 или 1.25.76');return}let p='';for(let i=0;i<bits.length-1;i++){p+=(i?'.':'')+bits[i];expanded.add(p)}build();const n=lookup.get(bits.join('.'));if(!n)return;scale=Math.max(scale,.85);panX=w*.27-n.x*scale;panY=(h+header.offsetHeight)*.5-n.y*scale;dirty=true;toast('клиент '+id)}function toast(t){const el=document.getElementById('toast');el.textContent=t;el.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>el.style.display='none',1800)}function toggle(id){if(id.split('.').length>=3)return;const old=lookup.get(id),screenY=old.y*scale+panY;if(expanded.has(id)){for(const v of [...expanded])if(v===id||v.startsWith(id+'.'))expanded.delete(v)}else{if(rows.length>MAX_VISIBLE-100){toast('слишком много открытых веток, сверни часть');return}expanded.add(id)}build();const n=lookup.get(id);if(n)panY=screenY-n.y*scale;dirty=true}
canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});dragDistance=0;lastPinch=0;canvas.classList.add('drag')});canvas.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;const prev=pointers.get(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===1){const dx=e.clientX-prev.x,dy=e.clientY-prev.y;panX+=dx;panY+=dy;dragDistance+=Math.abs(dx)+Math.abs(dy)}else if(pointers.size===2){const a=[...pointers.values()],dist=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);if(lastPinch)zoomAt(dist/lastPinch,(a[0].x+a[1].x)/2,(a[0].y+a[1].y)/2);lastPinch=dist;dragDistance+=10}dirty=true});canvas.addEventListener('pointerup',e=>{const wasOne=pointers.size===1;pointers.delete(e.pointerId);lastPinch=0;canvas.classList.remove('drag');if(!wasOne||dragDistance>9)return;const p=world(e.clientX,e.clientY);let hit=null;for(const n of rows){if(Math.abs(n.y-p.y)<17&&p.x>=n.x-18&&p.x<=n.x+260){hit=n;break}}if(hit)toggle(hit.id)});canvas.addEventListener('pointercancel',e=>{pointers.delete(e.pointerId);lastPinch=0});canvas.addEventListener('wheel',e=>{e.preventDefault();if(e.ctrlKey||e.metaKey||Math.abs(e.deltaY)<30)zoomAt(Math.exp(-e.deltaY*.002),e.clientX,e.clientY);else{panX-=e.deltaX;panY-=e.deltaY;dirty=true}},{passive:false});document.getElementById('plus').onclick=()=>zoomAt(1.25,w/2,h/2);document.getElementById('minus').onclick=()=>zoomAt(.8,w/2,h/2);document.getElementById('fit').onclick=overview;document.getElementById('reset').onclick=()=>{expanded.clear();build();overview()};document.getElementById('find').onclick=()=>focus(document.getElementById('search').value.trim());document.getElementById('search').addEventListener('keydown',e=>{if(e.key==='Enter'){e.target.blur();focus(e.target.value.trim())}});addEventListener('resize',()=>{resize();dirty=true});resize();build();overview();tick()})();
</script></body></html>
